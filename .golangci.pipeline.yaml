# More info on config here: https://github.com/golangci/golangci-lint#config-file
run:
  deadline: 10s
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  govet:
    shadow: true
  golint:
    min-confidence: 0
  goconst:
    min-len:         2
    min-occurrences: 2
  gosec:
    excludes:
      - G115
  revive:
    rules:
      - name: flag-parameter
        severity: warning
        disabled: true
        exclude: [ "" ]
  stylecheck:
    checks:
      - all
      - '-ST1000'

linters:
  disable-all: true
  enable:
    - revive
    - govet
    - errcheck
    - ineffassign
    - typecheck
    - goconst
    - gosec
    - goimports
    - gosimple
    - staticcheck
    - stylecheck
    - unused

issues:
  exclude-use-default: false
  exclude:
    # _ instead of err checks
    - G104
    - G306
    # md5 using for hash generation, not for security, so ignore this
    - G401
    - G501
    # for "public interface + private test_structs implementation" cases only!
    - exported func * returns unexported type *, which can be annoying to use
    # can be removed in the development phase
    # - (comment on exported (method|function|type|const)|should have( a package)? comment|comment should be of the form)
    # not for the active development - can be removed in the stable phase
    # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
    - Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv|.*Rollback). is not checked
    - should check returned error before deferring
    - should have comment or be unexported
    - a blank import should be only in a main or test package
    - Can't process result by diff processor
    - at least one file in a package should have a package comment
    - should not use underscores in package names

exclude-files:
  - \.pb\.go$
  - \.pb\.goclay\.go$
  - \_test.go$
  - go.mod
exclude-dirs:
  - bin
  - vendor
  - var
  - tmp
